spring:
  datasource:
    url: jdbc:h2:mem:careconnect_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

server:
  port: 8082

jwt:
  secret: test-secret-key-for-integration-tests-min-32-bytes-long
  expiration: 3600000
  refresh-expiration: 86400000

logging:
  level:
    com.healthcare: DEBUG
    org.hibernate.SQL: WARN